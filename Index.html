<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Question</title>

<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        background:#ffe6f2;
        overflow:hidden;
        height:100vh;
    }

    h1{
        margin-top:100px;
        color:#ff1493;
    }

    .container{
        margin-top:50px;
    }

    button{
        padding:15px 30px;
        font-size:20px;
        border:none;
        border-radius:10px;
        cursor:pointer;
    }

    #yesBtn{
        position:absolute;
        background:#4CAF50;
        color:white;
        left:45%;
        top:50%;
    }

    #noBtn{
        background:#ff4d4d;
        color:white;
        margin-left:150px;
    }
</style>
</head>

<body>

<h1>Hey what’s  up Darling❤️<br>Do you love me?</h1>

<div class="container">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
</div>

<script>
let attempts = 0;
const yesBtn = document.getElementById("yesBtn");

yesBtn.addEventListener("mouseover", () => {
    if(attempts < 8){
        attempts++;

        let maxX = window.innerWidth - 120;
        let maxY = window.innerHeight - 80;

        let x = Math.random() * maxX;
        let y = Math.random() * maxY;

        yesBtn.style.left = x + "px";
        yesBtn.style.top = y + "px";
    }
});

yesBtn.addEventListener("click", () => {
    if(attempts >= 8){
        document.body.innerHTML = `
            <h1 style="margin-top:200px;color:#ff1493;">
                ❤️ Yay! I knew it! I love you so much , hard work will always been paid.❤️
            </h1>
        `;
    }
});

document.getElementById("noBtn").addEventListener("click", () => {
    alert("Pangit mo😜");
});
</script>

</body>
</html>
